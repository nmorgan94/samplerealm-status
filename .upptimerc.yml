owner: nmorgan94
repo: samplerealm-status

secrets:
  - HEALTH_TOKEN

sites:
  - name: Website
    url: https://samplerealm.com
  - name: Plugin catalogue
    url: https://samplerealm.com/api/health?check=catalogue
    headers:
      - "X-Health-Token: $HEALTH_TOKEN"
  - name: Installer downloads
    url: https://samplerealm.com/api/health?check=installers
    headers:
      - "X-Health-Token: $HEALTH_TOKEN"
  - name: Licence activation
    url: https://samplerealm.com/api/health?check=licences
    headers:
      - "X-Health-Token: $HEALTH_TOKEN"

workflowSchedule:
  uptime: "*/5 * * * *"

status-website:
  cname: status.samplerealm.com
  name: SampleRealm Status
  logoUrl: https://samplerealm.com/images/sample-realm-icon.png
  introTitle: "SampleRealm services"
  introMessage: Live status of samplerealm.com, plugin downloads and licence activation.
  navbar:
    - title: Status
      href: /
    - title: SampleRealm
      href: https://samplerealm.com
